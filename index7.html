<!DOCTYPE html>
<html>
<head>
<title>Music CRUD</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top left, #667eea, #764ba2 40%, #1e1e2f 100%);
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 520px;
  background: rgba(255,255,255,0.95);
  padding: 35px;
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  backdrop-filter: blur(10px);
}

h1 {
  text-align: center;
  margin-bottom: 8px;
  color: #333;
}

.subtitle {
  text-align: center;
  margin-bottom: 25px;
  color: #666;
  font-size: 14px;
}

select, input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
  transition: 0.2s;
}

input:focus, select:focus {
  border-color: #764ba2;
  outline: none;
  box-shadow: 0 0 6px rgba(118,75,162,0.4);
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #764ba2;
  color: white;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s;
}

button:hover {
  background: #5a3583;
}

.add-btn {
  width: 100%;
  margin-bottom: 15px;
}

h3 {
  margin-bottom: 10px;
  color: #444;
}

ul {
  list-style: none;
}

li {
  background: #f3f4f8;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  animation: fadeIn 0.3s ease;
}

li button {
  background: #ff4d6d;
  font-size: 12px;
}

li button:hover {
  background: #d93652;
}

.error {
  color: #ff2e63;
  font-size: 13px;
  margin-bottom: 10px;
  display: none;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

</head>
<body>

<div class="container">

<h1> Music Record Manager</h1>
<p class="subtitle">Simple CRUD System for Music Database</p>

<select id="moduleSelect">
  <option value="artists">Artists</option>
  <option value="songs">Songs</option>
  <option value="albums">Albums</option>
  <option value="genres">Genres</option>
  <option value="playlists">Playlists</option>
  <option value="labels">Labels</option>
  <option value="awards">Awards</option>
</select>

<input type="text" id="inputValue" placeholder="Enter name/title">
<div id="errorMsg" class="error"> This field is required</div>

<button class="add-btn" onclick="addItem()">Add Record</button>

<h3>Total Records: <span id="total">0</span></h3>

<ul id="list"></ul>

</div>

<script>
let current = "artists";

document.getElementById("moduleSelect").onchange = function() {
  current = this.value;
  loadData();
};

async function loadData() {
  const res = await fetch(`/api/${current}`);
  const data = await res.json();

  document.getElementById("total").innerText = data.length;

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item => {
    const li = document.createElement("li");
    li.innerHTML = `
      ${item.name || item.title || "Record"}
      <button onclick="deleteItem(${item.id})">Delete</button>
    `;
    list.appendChild(li);
  });
}

async function addItem() {
  const input = document.getElementById("inputValue");
  const error = document.getElementById("errorMsg");
  const value = input.value.trim();

  if (!value) {
    error.style.display = "block";
    input.focus();
    return;
  }

  error.style.display = "none";

  await fetch(`/api/${current}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: value })
  });

  input.value = "";
  loadData();
}

async function deleteItem(id) {
  await fetch(`/api/${current}?id=${id}`, {
    method: "DELETE"
  });
  loadData();
}

window.onload = loadData;
</script>

</body>
</html>
